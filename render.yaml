services:
  - type: web
    name: legalfly-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: free
    healthCheckPath: /ready
    envVars:
      - key: LEGALFLY_ENCODER
        value: hashing
      - key: LEGALFLY_DEMO_MODE
        value: "false"
      - key: LEGALFLY_CORS_ORIGINS
        value: "https://thelegalfly.vercel.app"
      - key: LEGALFLY_LOG_RAW_TEXT
        value: "false"
      - key: LEGALFLY_ALLOW_AUTO_TRAIN
        value: "false"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
