# fly.toml app configuration file generated for LegalFly API
# Deploy: fly launch --config fly.toml --dockerfile Dockerfile.api
# Then:   fly deploy

app = "legalfly-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.api"

[env]
  LEGALFLY_ENCODER = "hashing"
  LEGALFLY_DEMO_MODE = "false"
  LEGALFLY_CORS_ORIGINS = "*"
  LEGALFLY_LOG_RAW_TEXT = "false"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
