services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      LEGALFLY_DEMO_MODE: "true"
      LEGALFLY_ENCODER: hashing
      LEGALFLY_CORS_ORIGINS: http://localhost:3000
      LEGALFLY_LOG_RAW_TEXT: "false"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_DEMO_MODE: "true"
    depends_on:
      api:
        condition: service_healthy