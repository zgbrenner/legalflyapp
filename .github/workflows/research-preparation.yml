name: Prepare research inputs
on:
  push:
    branches: [feat/the-legal-fly-laboratory]
    paths: [.github/workflows/research-preparation.yml]
permissions:
  contents: read
jobs:
  embeddings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          pip install --disable-pip-version-check sentence-transformers numpy
      - run: |
          mkdir -p /tmp/research-inputs
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          import numpy as np
          from sentence_transformers import SentenceTransformer
          model = SentenceTransformer('sentence-transformers/all-MiniLM-L6-v2', device='cpu')
          manifest = {'encoder':'sentence-transformers/all-MiniLM-L6-v2','normalized':True,'max_seq_length':model.max_seq_length,'source_commit':'${{ github.sha }}','splits':{}}
          for split in ['train','validation','test']:
              path = Path('data/demo/sensitive_harder') / f'{split}.jsonl'
              rows = [json.loads(line) for line in path.read_text().splitlines()]
              X = model.encode([r['text'] for r in rows], normalize_embeddings=True, batch_size=64, show_progress_bar=False)
              np.save(f'/tmp/research-inputs/{split}.npy', X.astype(np.float32))
              manifest['splits'][split] = {'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'n':len(rows)}
          Path('/tmp/research-inputs/manifest.json').write_text(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: minilm-embeddings
          path: /tmp/research-inputs
          retention-days: 3
  web-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: tar -czf /tmp/web-dependencies.tar.gz -C apps/web node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: web-dependencies
          path: /tmp/web-dependencies.tar.gz
          retention-days: 1
