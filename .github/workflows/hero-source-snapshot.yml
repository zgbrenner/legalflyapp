name: Hero source snapshot
on:
  push:
    branches: [feat/legal-dreaming]
    paths: [.github/workflows/hero-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar HEAD > /tmp/legalfly-hero-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: legalfly-hero-source
          path: /tmp/legalfly-hero-source.tar
          retention-days: 1
