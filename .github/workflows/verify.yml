name: Verify The Legal Fly
on:
  push:
    branches: [main, codex/the-legal-fly]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Capture exact source under test
        run: tar --exclude=.git -czf "$RUNNER_TEMP/source.tgz" .
      - uses: actions/upload-artifact@v4
        with:
          name: source-under-test
          path: ${{ runner.temp }}/source.tgz
          retention-days: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install research dependencies
        run: pip install -e '.[dev]'
      - name: Python tests
        env:
          LEGALFLY_ENCODER: hashing
        run: pytest -q
      - name: Web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Web tests and production build
        working-directory: apps/web
        run: npm test && npm run build
