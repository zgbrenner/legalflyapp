name: Verify The Legal Fly
on:
  pull_request:
  push:
    branches: [feat/the-legal-fly-laboratory]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar HEAD | gzip > /tmp/legalfly-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: /tmp/legalfly-source.tar.gz
          retention-days: 3
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEGALFLY_ENCODER: hashing
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy scipy scikit-learn fastapi uvicorn pydantic-settings httpx joblib rich typer pytest pytest-asyncio
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: apps/web
