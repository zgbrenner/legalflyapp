name: Village source verification
on:
  push:
    branches: [codex/village-lawyer]
    paths: [.github/workflows/village-source-check.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyarrow==21.0.0 numpy==2.2.6
      - name: Inspect authentic release files and record integrity
        run: |
          mkdir -p source-check
          python - <<'PY'
          import urllib.request, hashlib, base64, json, pathlib
          import pyarrow.feather as feather
          import pyarrow.ipc as ipc
          root = pathlib.Path('source-check')
          base = 'https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/'
          names = ['body-annotations-male-cns-v1.0-minconf-0.5.feather', 'body-neurotransmitters-male-cns-v1.0.feather', 'connectome-weights-male-cns-v1.0-minconf-0.5.feather']
          report = {}
          for name in names:
              sha, md5 = hashlib.sha256(), hashlib.md5()
              with urllib.request.urlopen(base+name, timeout=120) as response, open(root/name, 'wb') as out:
                  headers = dict(response.headers)
                  while block := response.read(4*1024*1024):
                      sha.update(block); md5.update(block); out.write(block)
              md5b64 = base64.b64encode(md5.digest()).decode()
              hashes = headers.get('x-goog-hash', '')
              if 'md5=' in hashes:
                  assert md5b64 == hashes.split('md5=')[1].split(',')[0].strip(), 'Upstream MD5 mismatch'
              reader = ipc.open_file(str(root/name))
              sample = reader.get_batch(0).slice(0,3).to_pydict()
              item = {'url':base+name,'sha256':sha.hexdigest(),'md5':md5b64,'generation':headers.get('x-goog-generation'),'bytes':(root/name).stat().st_size,'schema':str(reader.schema),'batches':reader.num_record_batches,'rows':sum(reader.get_batch(i).num_rows for i in range(reader.num_record_batches)),'sample':repr(sample)}
              report[name] = item
              print(name, json.dumps(item, indent=2), flush=True)
              if name.startswith('body-annotations'):
                  table = feather.read_table(root/name)
                  for col in ['status','class','super_class','superclass','somaNeuromere','cell_type','type']:
                      if col in table.column_names:
                          from collections import Counter
                          print(col, Counter(table[col].to_pylist()).most_common(30), flush=True)
          (root/'report.json').write_text(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: village-source-report
          path: source-check/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: village-source-annotations
          path: |
            source-check/body-annotations*.feather
            source-check/body-neurotransmitters*.feather
          retention-days: 2
