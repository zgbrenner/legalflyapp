name: Export source evidence
on:
  push:
    branches: [feat/the-legal-fly]
    paths: [.github/workflows/source-evidence.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          git archive HEAD --format=tar.gz > /tmp/legalfly-source.tar.gz
          sha256sum /tmp/legalfly-source.tar.gz > /tmp/legalfly-source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: legalfly-source
          path: /tmp/legalfly-source.*
          retention-days: 3
