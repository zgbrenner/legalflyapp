name: Final interface verification
on:
  push:
    branches: [feat/the-legal-fly]
    paths: [.github/workflows/final-web-qa.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: legalfly-final-web
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  verify:
    if: github.ref == 'refs/heads/feat/the-legal-fly'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      LEGALFLY_ENCODER: hashing
      LEGALFLY_CORS_ORIGINS: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: '1'
      QA_ARTIFACTS_DIR: /tmp/legalfly-qa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/the-legal-fly
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: legalfly-browser-evidence
          run-id: 34737001605
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/previous-evidence
      - name: Recover the tested web release without test-generated model files
        run: |
          if ! grep -q '"next": "15.5.24"' apps/web/package.json; then
            git apply --check --include='apps/web/*' /tmp/previous-evidence/uncommitted.patch
            git apply --include='apps/web/*' /tmp/previous-evidence/uncommitted.patch
          fi
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/browser_smoke.py'); text=p.read_text()
          text=text.replace("await page.get_by_role('alert').inner_text()", "await page.get_by_role('alert').filter(has_text='Enter a passage').inner_text()")
          p.write_text(text)
          PY
      - name: Verify the exact patched dependency lock
        working-directory: apps/web
        run: |
          mkdir -p /tmp/legalfly-qa
          npm ci --no-audit --no-fund
          npm test 2>&1 | tee /tmp/legalfly-qa/web-tests.txt
          npm run lint 2>&1 | tee /tmp/legalfly-qa/lint.txt
          npm run build 2>&1 | tee /tmp/legalfly-qa/build.txt
      - name: Verify the real API
        run: |
          pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3 fastapi uvicorn pydantic-settings httpx rich typer pytest pytest-asyncio playwright
          pip install --no-deps -e .
          mkdir -p data/processed
          cp -R deploy/data/processed/hemibrain data/processed/
          python -m pytest -q | tee /tmp/legalfly-qa/python-tests.txt
          python -m playwright install --with-deps chromium
      - name: Preserve the passing source and dependency lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/app apps/web/components/TwinChamber.tsx apps/web/tests/experience.test.tsx apps/web/package.json apps/web/package-lock.json scripts/browser_smoke.py
          if ! git diff --cached --quiet; then
            git commit -m 'feat: finish the experiment UX and verify patched React 19 runtime'
            git push origin HEAD:feat/the-legal-fly
          fi
      - name: Test desktop, mobile and live inference
        run: |
          uvicorn apps.api.app.main:app --host 127.0.0.1 --port 8000 > /tmp/legalfly-qa/api.log 2>&1 &
          (cd apps/web && npm start -- --hostname 127.0.0.1 > /tmp/legalfly-qa/web.log 2>&1) &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/ready >/dev/null && curl -fsS http://127.0.0.1:3000 >/dev/null; then break; fi
            sleep 2
          done
          python -m scripts.browser_smoke
      - name: Package evidence even on failure
        if: always()
        run: |
          mkdir -p /tmp/legalfly-qa
          git archive HEAD --format=tar.gz > /tmp/legalfly-qa/source.tar.gz
          git diff --binary > /tmp/legalfly-qa/uncommitted.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legalfly-browser-evidence
          path: /tmp/legalfly-qa
          retention-days: 14
