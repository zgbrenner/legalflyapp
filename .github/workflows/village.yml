name: Village Lawyer verification
on:
  push:
    branches: [main, codex/village-lawyer]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: village-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt -r requirements-test.txt
      - run: npm ci
      - run: npm test && python -m unittest discover -s tests -p 'test_*.py'
      - name: Download, verify and compute with the complete MaleCNS graph
        run: npm run build
      - run: npm run test:full
      - run: python -m playwright install --with-deps chromium
      - name: Actual browser worker and responsive UI
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/village-evidence
        run: |
          node scripts/serve.mjs dist > /tmp/village-server.log 2>&1 &
          for i in $(seq 1 30); do curl --silent --fail http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          python tests/browser_smoke.py
      - name: Include a no-dependency launcher
        run: |
          cp scripts/serve.mjs dist/serve.mjs
          cp DEPLOY.md dist/RUNNING.md
          cp LICENSE dist/LICENSE
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: village-lawyer-ready-to-run
          path: dist/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: village-lawyer-verification
          path: |
            results/
            ${{ runner.temp }}/village-evidence/
          retention-days: 30
