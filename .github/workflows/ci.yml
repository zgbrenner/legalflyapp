name: Village Lawyer verification
on:
  push:
    branches: [main, feat/village-lawyer]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: village-${{ github.ref }}
  cancel-in-progress: true
jobs:
  complete-cns:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mechanical unit tests (not biological evidence)
        run: npm test
      - uses: actions/cache@v4
        with:
          path: data/compiled
          key: malecns-brain-v1-c29919aa-cc9bd1ec
      - name: Install data tooling
        run: python -m pip install -r requirements-data.txt
      - name: Download and verify the COMPLETE MaleCNS
        run: python tools/prepare.py
      - name: Actual full-graph training, inference and controls
        run: npm run test:full
      - name: Build the complete static site
        run: VILLAGE_DATA_READY=1 node apps/web/build.mjs
      - name: Install browser test tooling
        run: |
          python -m pip install playwright==1.55.0 pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Real browser, real biological graph
        env:
          FULL_CNS: '1'
          SERVE_DIST: '1'
        run: python tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-male-cns-evidence
          path: results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: village-lawyer-static-site
          path: dist/
          compression-level: 1
