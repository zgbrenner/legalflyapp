name: Village Lawyer verification
on:
  push:
    branches: [main, feat/village-lawyer]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: data/compiled
          key: malecns-brain-v1-c29919aa-cc9bd1ec
      - run: python -m pip install -r requirements-data.txt
      - name: Verify complete MaleCNS data
        run: python tools/prepare.py --skip-art
      - uses: actions/upload-artifact@v4
        with:
          name: source-verification
          path: site/data/manifest.json
