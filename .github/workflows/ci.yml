name: Verify The Legal Fly
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact source without credentials
        run: git archive --format=tar HEAD -o source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: source.tar
          retention-days: 3
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEGALFLY_ENCODER: hashing
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev]'
      - run: pytest -q
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
