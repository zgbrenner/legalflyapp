[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legalfly"
version = "0.1.0"
description = "Drosophila connectome topology as a reservoir computer for sensitive-information detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LegalFly Contributors" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "numpy>=1.26.0",
  "scipy>=1.13.0",
  "scikit-learn>=1.5.0",
  "torch>=2.2.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "orjson>=3.10.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "joblib>=1.4.0",
]

[project.optional-dependencies]
research = [
  "sentence-transformers>=3.0.0",
]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
  "httpx>=0.27.0",
]

[project.scripts]
legalfly = "research.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["research*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"